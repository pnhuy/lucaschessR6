# Reconstructed: the upstream Cargo.toml is not included in src.7z.
# The generated tables in src/chess_data_in are already present, so src/build.rs
# does not need to run. Hactar has no external dependencies.
[package]
name = "hactar"
version = "0.1.0"
edition = "2015"

[[bin]]
name = "hactar"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
